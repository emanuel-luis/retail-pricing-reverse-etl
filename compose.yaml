# Memory limits are sized so the whole loop fits a laptop Docker VM (docs/PLAN.md section 1).
# This file grows with each pull request; today: the OLTP and the control/audit Postgres,
# ClickHouse, the S3-compatible store and the dbt runner (profile core), and the workload
# generator (profile workload). Measured on 2026-11-02 at SF0.01: oltp 119 MiB, control-db 95 MiB,
# workload 47 MiB (20 sales/s); clickhouse 719 MiB, s3 133 MiB and dbt-runner 61 MiB after two
# dbt builds (largest dbt query 166 MiB).
name: retail-pricing-reverse-etl

x-app-build: &app-build
  context: .
  dockerfile: docker/app.Dockerfile

services:
  oltp:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    profiles: [core]
    mem_limit: 1280m
    shm_size: 256m
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=60
      - -c
      - max_wal_size=4GB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_DB: ${OLTP_DB:-retail}
      POSTGRES_USER: ${OLTP_OWNER_USER:-oltp_owner}
      POSTGRES_PASSWORD: ${OLTP_OWNER_PASSWORD:?set OLTP_OWNER_PASSWORD in .env}
    ports:
      - "127.0.0.1:${OLTP_PG_PORT:-25432}:5432"
    volumes:
      # PG 18 keeps PGDATA under /var/lib/postgresql/<major>, so the mount is one level up.
      - oltp_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30

  control-db:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    profiles: [core]
    mem_limit: 256m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "work_mem=4MB", "-c", "max_connections=40"]
    environment:
      POSTGRES_DB: ${CONTROL_DB:-control}
      POSTGRES_USER: ${CONTROL_OWNER_USER:-control_owner}
      POSTGRES_PASSWORD: ${CONTROL_OWNER_PASSWORD:?set CONTROL_OWNER_PASSWORD in .env}
    ports:
      - "127.0.0.1:${CONTROL_PG_PORT:-25433}:5432"
    volumes:
      - control_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30

  s3:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    profiles: [core]
    mem_limit: 384m
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "127.0.0.1:${S3_API_PORT:-29000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-29001}:9001"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3@sha256:de3e47c64078aa196dae2349e048fc98ba81947f651f5c20e06e46baea8ae40a
    profiles: [core]
    mem_limit: 2304m
    # Not root: the entrypoint would chown the read-only data mount and exit.
    user: "101:101"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ch_admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      # Read by config/clickhouse through from_env.
      CLICKHOUSE_NIFI_PASSWORD: ${CLICKHOUSE_NIFI_PASSWORD:?set CLICKHOUSE_NIFI_PASSWORD in .env}
      CLICKHOUSE_DBT_PASSWORD: ${CLICKHOUSE_DBT_PASSWORD:?set CLICKHOUSE_DBT_PASSWORD in .env}
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?set CLICKHOUSE_GRAFANA_PASSWORD in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RAW_S3_URL: ${RAW_S3_URL:-http://s3:9000/retail-raw/}
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-28123}:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # Single files: the image entrypoint writes its own file into users.d at start.
      - ./config/clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./config/clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./config/clickhouse/config.d/named-collections.xml:/etc/clickhouse-server/config.d/named-collections.xml:ro
      - ./config/clickhouse/users.d/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      # `ch load-raw` reads the OLTP seed Parquet through file() (dev and CI only).
      - ./data:/var/lib/clickhouse/user_files:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  dbt-runner:
    # The one service that builds the shared app image (compose refuses two builders of a tag).
    build: *app-build
    image: retail-pricing-app:local
    profiles: [core]
    mem_limit: 512m
    command: ["dbt-runner", "serve"]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      DBT_RUNNER_HOST: 0.0.0.0
      DBT_RUNNER_PORT: "8580"
      DBT_RUNNER_PROJECT_DIR: /home/app/dbt
      DBT_RUNNER_STATE_DIR: /var/lib/dbt-runner
      DBT_THREADS: ${DBT_THREADS:-2}
      # Read by dbt/profiles.yml through env_var.
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DBT_USER: dbt
      CLICKHOUSE_DBT_PASSWORD: ${CLICKHOUSE_DBT_PASSWORD:?set CLICKHOUSE_DBT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DBT_RUNNER_PORT:-28580}:8580"
    volumes:
      - dbt_runner_state:/var/lib/dbt-runner
    healthcheck:
      test: ["CMD", "retail-pricing", "health", "--url", "http://127.0.0.1:8580/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  workload:
    # Reuses the image dbt-runner builds; `docker compose --profile core build dbt-runner` first.
    image: retail-pricing-app:local
    pull_policy: never
    profiles: [workload]
    mem_limit: 256m
    command: ["workload", "run"]
    depends_on:
      oltp:
        condition: service_healthy
      dbt-runner:
        condition: service_started
        required: false
    environment:
      # Inside the network the OLTP is reached by name, whatever the host-side .env says.
      OLTP_HOST: oltp
      OLTP_PORT: "5432"
      OLTP_DB: ${OLTP_DB:-retail}
      OLTP_WORKLOAD_PASSWORD: ${OLTP_WORKLOAD_PASSWORD:?set OLTP_WORKLOAD_PASSWORD in .env}
      WORKLOAD_SEED: ${WORKLOAD_SEED:-7}
      WORKLOAD_SALES_PER_SECOND: ${WORKLOAD_SALES_PER_SECOND:-20}
      WORKLOAD_PRICE_EDITS_PER_SECOND: ${WORKLOAD_PRICE_EDITS_PER_SECOND:-0.5}
      WORKLOAD_DAY_SECONDS: ${WORKLOAD_DAY_SECONDS:-600}
    healthcheck:
      test: ["CMD", "retail-pricing", "health", "--url", "http://127.0.0.1:9108/metrics"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  oltp_data:
  control_data:
  s3_data:
  clickhouse_data:
  dbt_runner_state:
