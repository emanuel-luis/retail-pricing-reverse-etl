# Memory limits are sized so the whole loop fits a laptop Docker VM (docs/PLAN.md section 1).
# Profiles: core (the OLTP and the control/audit Postgres, ClickHouse, the S3-compatible store,
# the dbt runner and NiFi), workload (the workload generator) and monitoring (Prometheus, Grafana,
# two postgres-exporters and the NiFi token sidecar). `expose` lists the ports Prometheus scrapes. Measured on 2026-11-02 at SF0.01: oltp 119 MiB, control-db 95 MiB,
# workload 47 MiB (20 sales/s); clickhouse 719 MiB, s3 133 MiB and dbt-runner 61 MiB after two
# dbt builds (largest dbt query 166 MiB). On 2026-11-03 at SF1 (full extract and load of 4.7M
# rows): nifi 0.94 GiB idle and 1.9 GiB peak of its 2 GiB, clickhouse 637 MiB, oltp 804 MiB.
name: retail-pricing-reverse-etl

x-app-build: &app-build
  context: .
  dockerfile: docker/app.Dockerfile

services:
  oltp:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    profiles: [core]
    mem_limit: 1280m
    shm_size: 256m
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=60
      - -c
      - max_wal_size=4GB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_DB: ${OLTP_DB:-retail}
      POSTGRES_USER: ${OLTP_OWNER_USER:-oltp_owner}
      POSTGRES_PASSWORD: ${OLTP_OWNER_PASSWORD:?set OLTP_OWNER_PASSWORD in .env}
    ports:
      - "127.0.0.1:${OLTP_PG_PORT:-25432}:5432"
    volumes:
      # PG 18 keeps PGDATA under /var/lib/postgresql/<major>, so the mount is one level up.
      - oltp_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30

  control-db:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    profiles: [core]
    mem_limit: 256m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "work_mem=4MB", "-c", "max_connections=40"]
    environment:
      POSTGRES_DB: ${CONTROL_DB:-control}
      POSTGRES_USER: ${CONTROL_OWNER_USER:-control_owner}
      POSTGRES_PASSWORD: ${CONTROL_OWNER_PASSWORD:?set CONTROL_OWNER_PASSWORD in .env}
    ports:
      - "127.0.0.1:${CONTROL_PG_PORT:-25433}:5432"
    volumes:
      - control_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30

  s3:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    profiles: [core]
    mem_limit: 384m
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "127.0.0.1:${S3_API_PORT:-29000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-29001}:9001"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3@sha256:de3e47c64078aa196dae2349e048fc98ba81947f651f5c20e06e46baea8ae40a
    profiles: [core]
    mem_limit: 2304m
    # Not root: the entrypoint would chown the read-only data mount and exit.
    user: "101:101"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ch_admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      # Read by config/clickhouse through from_env.
      CLICKHOUSE_NIFI_PASSWORD: ${CLICKHOUSE_NIFI_PASSWORD:?set CLICKHOUSE_NIFI_PASSWORD in .env}
      CLICKHOUSE_DBT_PASSWORD: ${CLICKHOUSE_DBT_PASSWORD:?set CLICKHOUSE_DBT_PASSWORD in .env}
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?set CLICKHOUSE_GRAFANA_PASSWORD in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RAW_S3_URL: ${RAW_S3_URL:-http://s3:9000/retail-raw/}
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-28123}:8123"
    expose: ["9363"]
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # Single files: the image entrypoint writes its own file into users.d at start.
      - ./config/clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./config/clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./config/clickhouse/config.d/named-collections.xml:/etc/clickhouse-server/config.d/named-collections.xml:ro
      - ./config/clickhouse/users.d/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      # `ch load-raw` reads the OLTP seed Parquet through file() (dev and CI only).
      - ./data:/var/lib/clickhouse/user_files:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  dbt-runner:
    # The one service that builds the shared app image (compose refuses two builders of a tag).
    build: *app-build
    image: retail-pricing-app:local
    profiles: [core]
    mem_limit: 512m
    command: ["dbt-runner", "serve"]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      DBT_RUNNER_HOST: 0.0.0.0
      DBT_RUNNER_PORT: "8580"
      DBT_RUNNER_PROJECT_DIR: /home/app/dbt
      DBT_RUNNER_STATE_DIR: /var/lib/dbt-runner
      DBT_THREADS: ${DBT_THREADS:-2}
      # Read by dbt/profiles.yml through env_var.
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DBT_USER: dbt
      CLICKHOUSE_DBT_PASSWORD: ${CLICKHOUSE_DBT_PASSWORD:?set CLICKHOUSE_DBT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DBT_RUNNER_PORT:-28580}:8580"
    volumes:
      - dbt_runner_state:/var/lib/dbt-runner
    healthcheck:
      test: ["CMD", "retail-pricing", "health", "--url", "http://127.0.0.1:8580/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  nifi:
    build:
      context: docker
      dockerfile: nifi.Dockerfile
    image: retail-pricing-nifi:local
    profiles: [core]
    mem_limit: 2048m
    # The self-signed certificate NiFi generates on first start names the hostname, and Jetty
    # refuses a TLS name it does not carry (400 Invalid SNI): Prometheus and nifi-token use `nifi`.
    hostname: nifi
    # No depends_on: flows retry their own connections, and NiFi boots slower than the rest.
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME:-nifi_admin}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:?set NIFI_PASSWORD in .env (12+ characters)}
      NIFI_SENSITIVE_PROPS_KEY: ${NIFI_SENSITIVE_PROPS_KEY:?set NIFI_SENSITIVE_PROPS_KEY in .env (12+ characters)}
      NIFI_WEB_PROXY_HOST: 127.0.0.1:${NIFI_HTTPS_PORT:-28443},localhost:${NIFI_HTTPS_PORT:-28443}
      NIFI_JVM_HEAP_INIT: 1280m
      NIFI_JVM_HEAP_MAX: 1280m
    ports:
      - "127.0.0.1:${NIFI_HTTPS_PORT:-28443}:8443"
      - "127.0.0.1:${NIFI_TRIGGER_PORT:-28081}:8081"
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - nifi_database:/opt/nifi/nifi-current/database_repository
    # The image HEALTHCHECK is a TCP probe on 8443; NiFi needs about a minute to open it.

  workload:
    # Reuses the image dbt-runner builds; `docker compose --profile core build dbt-runner` first.
    image: retail-pricing-app:local
    pull_policy: never
    profiles: [workload]
    mem_limit: 256m
    command: ["workload", "run"]
    expose: ["9108"]
    depends_on:
      oltp:
        condition: service_healthy
      dbt-runner:
        condition: service_started
        required: false
    environment:
      # Inside the network the OLTP is reached by name, whatever the host-side .env says.
      OLTP_HOST: oltp
      OLTP_PORT: "5432"
      OLTP_DB: ${OLTP_DB:-retail}
      OLTP_WORKLOAD_PASSWORD: ${OLTP_WORKLOAD_PASSWORD:?set OLTP_WORKLOAD_PASSWORD in .env}
      WORKLOAD_SEED: ${WORKLOAD_SEED:-7}
      WORKLOAD_SALES_PER_SECOND: ${WORKLOAD_SALES_PER_SECOND:-20}
      WORKLOAD_PRICE_EDITS_PER_SECOND: ${WORKLOAD_PRICE_EDITS_PER_SECOND:-0.5}
      WORKLOAD_DAY_SECONDS: ${WORKLOAD_DAY_SECONDS:-600}
    healthcheck:
      test: ["CMD", "retail-pricing", "health", "--url", "http://127.0.0.1:9108/metrics"]
      interval: 10s
      timeout: 5s
      retries: 6

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: [monitoring]
    mem_limit: 384m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-29090}:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      # The NiFi JWT nifi-token writes; Prometheus re-reads it on every scrape.
      - nifi_token:/var/run/nifi-token:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  grafana:
    image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    profiles: [monitoring]
    mem_limit: 320m
    environment:
      # Manual pin (Dependabot does not see it); the plugin persists in grafana_data.
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource@4.23.2
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      # Grafana starts every bundled backend plugin as its own process (about 25 MiB each), which
      # alone would fill mem_limit: only Prometheus, PostgreSQL and ClickHouse are needed.
      GF_PLUGINS_DISABLE_PLUGINS: >-
        cloudwatch,elasticsearch,grafana-advisor-app,grafana-azure-monitor-datasource,
        grafana-exploretraces-app,grafana-lokiexplore-app,grafana-metricsdrilldown-app,
        grafana-pyroscope-app,grafana-pyroscope-datasource,grafana-testdata-datasource,graphite,
        influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Anyone on this machine can look; only the admin can change anything.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:${GRAFANA_PORT:-23000}/
      # Read by config/grafana/provisioning/datasources through $VAR interpolation.
      CONTROL_DB: ${CONTROL_DB:-control}
      CONTROL_GRAFANA_PASSWORD: ${CONTROL_GRAFANA_PASSWORD:?set CONTROL_GRAFANA_PASSWORD in .env}
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?set CLICKHOUSE_GRAFANA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-23000}:3000"
    volumes:
      # One mount per folder: the image keeps its own empty plugins folder.
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  # The exporters log in as the `exporter` roles (pg_monitor only) that `oltp load` and
  # `control init` create; until then they serve pg_up 0.
  pg-exporter-oltp:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    profiles: [monitoring]
    mem_limit: 64m
    environment:
      DATA_SOURCE_URI: oltp:5432/${OLTP_DB:-retail}?sslmode=disable
      DATA_SOURCE_USER: exporter
      DATA_SOURCE_PASS: ${OLTP_EXPORTER_PASSWORD:?set OLTP_EXPORTER_PASSWORD in .env}
    expose: ["9187"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9187/"]
      interval: 10s
      timeout: 5s
      retries: 12

  pg-exporter-control:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    profiles: [monitoring]
    mem_limit: 64m
    environment:
      DATA_SOURCE_URI: control-db:5432/${CONTROL_DB:-control}?sslmode=disable
      DATA_SOURCE_USER: exporter
      DATA_SOURCE_PASS: ${CONTROL_EXPORTER_PASSWORD:?set CONTROL_EXPORTER_PASSWORD in .env}
    expose: ["9187"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9187/"]
      interval: 10s
      timeout: 5s
      retries: 12

  nifi-token:
    # The NiFi single-user JWT lasts about 8 h: fetch a new one every 6 h into the shared volume.
    image: retail-pricing-app:local
    pull_policy: never
    profiles: [monitoring]
    mem_limit: 96m
    # The user Prometheus runs as, so it can read the mode-600 file (docker/app.Dockerfile).
    user: "65534:65534"
    working_dir: /tmp
    command: ["nifi", "token", "--out", "/var/run/nifi-token/token", "--interval", "21600"]
    # A NiFi that stays down past --wait ends the process; the restart tries again.
    restart: unless-stopped
    depends_on:
      nifi:
        condition: service_healthy
    environment:
      NIFI_HOST: nifi
      NIFI_HTTPS_PORT: "8443"
      NIFI_USERNAME: ${NIFI_USERNAME:-nifi_admin}
      NIFI_PASSWORD: ${NIFI_PASSWORD:?set NIFI_PASSWORD in .env (12+ characters)}
    volumes:
      - nifi_token:/var/run/nifi-token
    healthcheck:
      test: ["CMD", "test", "-s", "/var/run/nifi-token/token"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  oltp_data:
  control_data:
  s3_data:
  clickhouse_data:
  dbt_runner_state:
  nifi_conf:
  nifi_state:
  nifi_content:
  nifi_flowfile:
  nifi_provenance:
  nifi_database:
  prometheus_data:
  grafana_data:
  nifi_token:
