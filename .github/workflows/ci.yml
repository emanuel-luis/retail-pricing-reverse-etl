name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  # per event: a push to main would otherwise cancel a weekly or manual run left pending
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1" # every uv sync and uv run fails if uv.lock is out of date

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { enable-cache: true }
      - run: uv sync --locked
      - run: make lint

  test-fast:
    name: test-fast (unit + SF0.01 data)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { enable-cache: true }
      - run: uv sync --locked
      - run: make test-fast
      # generates TPC-DS SF0.01 twice in temp dirs, builds the OLTP seed and checks it
      - run: make test-data

  diagrams:
    name: diagrams (D2 render check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # the pinned D2 release, checked against its sha256 in the Makefile
      - run: make d2-install
      - run: make diagrams-check
      - name: Upload the rendered SVGs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagrams
          path: docs/diagrams/*.svg
          if-no-files-found: warn
          retention-days: 7
