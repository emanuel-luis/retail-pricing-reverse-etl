name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  # per event: a push to main would otherwise cancel a weekly or manual run left pending
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1" # every uv sync and uv run fails if uv.lock is out of date

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { enable-cache: true }
      - run: uv sync --locked
      - run: make lint

  test-fast:
    name: test-fast (unit + SF0.01 data)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { enable-cache: true }
      - run: uv sync --locked
      - run: make test-fast
      # generates TPC-DS SF0.01 twice in temp dirs, builds the OLTP seed and checks it
      - run: make test-data

  sql:
    name: sql (Postgres functions)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { enable-cache: true }
      - run: uv sync --locked
      - run: cp .env.example .env
      - run: docker compose up -d --wait oltp control-db
      - run: make data SF=0.01
      - run: make load SF=0.01
      - run: make control-init
      - run: make test-sql
      - name: Service state and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200
      - name: Remove the stack
        if: always()
        run: make down

  dbt:
    name: dbt (ClickHouse, SF0.01)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { enable-cache: true }
      - run: uv sync --locked
      - run: cp .env.example .env
      - run: make data SF=0.01
      # dbt runs inside the dbt-runner container, the same way NiFi will call it
      - run: docker compose up -d --build --wait clickhouse s3 dbt-runner
      - run: make ch-init s3-init
      - run: make ch-load SF=0.01 CYCLE=1
      - run: make dbt-build CYCLE=1 AS_OF=2025-12-04
      # a second cycle exercises the incremental delete-and-append path
      - run: make ch-load SF=0.01 CYCLE=2
      - run: make dbt-build CYCLE=2 AS_OF=2025-12-04
      - run: make test-clickhouse
      - name: Service state and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 300
          docker compose cp dbt-runner:/var/lib/dbt-runner "$RUNNER_TEMP/dbt-runner" || true
      - name: Upload the dbt runner state (run_results.json, dbt logs)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbt-runner-state
          path: ${{ runner.temp }}/dbt-runner
          if-no-files-found: warn
          retention-days: 7
      - name: Remove the stack
        if: always()
        run: make down

  diagrams:
    name: diagrams (D2 render check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # the pinned D2 release, checked against its sha256 in the Makefile
      - run: make d2-install
      - run: make diagrams-check
      - name: Upload the rendered SVGs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagrams
          path: docs/diagrams/*.svg
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: e2e (compose loop, SF0.01)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 55
    env:
      # ci parameters: page_rows 5000, so ExecuteSQLRecord splits the bigger tables into files;
      # the reference-flow test redeploys with the same parameters
      DEPLOY_ENV: ci
      NIFI_DEPLOY_ENV: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { enable-cache: true }
      - run: uv sync --locked
      # the whole loop from scratch: data, stack (core and monitoring), load, deploy, three
      # cycles with conflicts injected into cycle 2, retail-pricing check, report; the
      # integration suite then includes tests/integration/test_monitoring_stack.py
      - run: make demo SF=0.01
      - run: make test-integration
      - name: Upload the demo run (steps, check, timings)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-run
          path: runs/
          if-no-files-found: warn
          retention-days: 7
      - name: Service state and logs
        if: failure()
        run: |
          docker compose --profile core --profile monitoring ps -a
          docker compose --profile core --profile monitoring logs --no-color --tail 300
          docker compose cp nifi:/opt/nifi/nifi-current/logs/nifi-app.log "$RUNNER_TEMP/nifi-app.log" || true
      - name: Upload the NiFi log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nifi-app-log
          path: ${{ runner.temp }}/nifi-app.log
          if-no-files-found: warn
          retention-days: 7
      - name: Remove the stack
        if: always()
        run: make down
